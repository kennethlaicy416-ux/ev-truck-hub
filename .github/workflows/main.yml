name: Daily EV Truck Intelligence Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢出倉庫代碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝 Python 依賴
        run: |
          pip install google-generativeai openai

      - name: 4. 執行多模型情報聚合
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python daily_scraper.py

      - name: 5. 自動推送最新 today_news.json 到網頁前端
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add today_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update daily intelligence JSON" && git push)
